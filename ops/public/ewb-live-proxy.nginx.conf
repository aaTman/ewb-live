# EWB Live public front — rendered by ops/setup-public.sh to
# /etc/nginx/conf.d/ewb-live.conf (placeholders substituted there).
#
# Topology: Cloudflare edge --(tunnel connector)--> cloudflared on this box
# --> this nginx (loopback only) --> ewb_live.serve. Nothing here is
# reachable from the public internet except through Cloudflare; the
# dashboard's own port (__WEB_PORT__) stays internal exactly as before.
#
# Cache policy notes (the app upstream is `python -m ewb_live.serve`, which
# sends Cache-Control: no-store on JSON so LAN users always see fresh data;
# we deliberately override that at this tier — JSON is rewritten at most once
# a week by the weekly cycle, so 60s of edge staleness is free and takes the
# public read load off the Python server entirely). In every location that
# overrides, `proxy_ignore_headers` stops nginx itself caching per the
# upstream header AND `proxy_hide_header` stops the upstream header reaching
# the client alongside ours (two Cache-Control headers would be ambiguous
# for the Cloudflare edge):
#   /data/results/history/  frozen weekly snapshots      immutable-ish (30 d)
#   /data/results/*.json    rewritten weekly             proxy 5 m, browser 60 s
#   images (png/webp/ico)   viz assets                   proxy 12 h, browser 12 h
#   everything else                                      honor upstream headers
#                                          (vendor/* 1 h, app shell revalidate)

proxy_cache_path /var/cache/nginx/ewb-live levels=1:2 keys_zone=ewb_live:10m
                 max_size=500m inactive=6h use_temp_path=off;

map $http_x_forwarded_proto $ewb_hsts {
    "https" "max-age=15768000";
    default "";
}

server {
    # Loopback only by default: the ONLY intended client is the cloudflared
    # connector running on this same box. (If the product owner instead
    # reuses the tunnel whose connector runs on another LXC, render with
    # EWB_PROXY_LISTEN=0.0.0.0 so that connector can reach us over the LAN.)
    listen __PROXY_LISTEN__:__PROXY_PORT__;
    listen [::1]:__PROXY_PORT__;
    server_name __PUBLIC_HOSTNAME__;
    server_tokens off;

    access_log /var/log/nginx/ewb-live.access.log;
    error_log  /var/log/nginx/ewb-live.error.log;

    include /etc/nginx/snippets/ewb-live-security.conf;

    # HTML is gzip'd by nginx (text/html is gzip's always-on default type);
    # json/js/css/svg arrive pre-compressed from the app server.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;

    proxy_http_version 1.0;            # ewb_live.serve is stdlib HTTP/1.0
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    proxy_cache ewb_live;
    proxy_cache_key "$host$request_uri";
    proxy_cache_lock on;
    # Serve the previous copy while the weekly atomic rewrite is in flight or
    # the app server is briefly down/restarting.
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

    # --- frozen weekly snapshots (data/results/history/<YYYY-WW>/) ---------
    location ~ ^/data/results/history/ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-EWB-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/ewb-live-security.conf;
    }

    # --- results JSON (live pointers + per-event viz.json) -----------------
    location ~ \.json$ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_cache_valid 200 5m;
        add_header Cache-Control "public, max-age=60, stale-while-revalidate=300" always;
        add_header X-EWB-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/ewb-live-security.conf;
    }

    # --- images / viz assets ------------------------------------------------
    location ~* \.(png|jpe?g|webp|gif|ico)$ {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_ignore_headers Cache-Control Expires;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_cache_valid 200 12h;
        add_header Cache-Control "public, max-age=43200" always;
        add_header X-EWB-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/ewb-live-security.conf;
    }

    # --- everything else: HTML shell + vendor assets ------------------------
    # Honor the app server's own headers (app shell revalidates, vendor 1 h);
    # nginx only caches what the upstream says is cacheable.
    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_cache_valid 200 1h;
        add_header X-EWB-Cache $upstream_cache_status always;
        include /etc/nginx/snippets/ewb-live-security.conf;
    }
}
