# Security headers for the public EWB Live front (rendered by
# ops/setup-public.sh to /etc/nginx/snippets/ewb-live-security.conf and
# included once in the server block AND in every location that sets its own
# add_header — nginx add_header inheritance replaces the whole outer set when
# a location declares any add_header of its own).
#
# TLS terminates at the Cloudflare edge (Cloudflare Tunnel), so HSTS is only
# emitted when the request actually came over https (X-Forwarded-Proto).
# CSP is deliberately absent: the dashboard loads vendor scripts from CDNs
# (Plotly/Leaflet per SPEC); tightening CSP is a design-lane change.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security $ewb_hsts always;
